# JSCAD Web Deployment Configuration (with integrated AI chat + API)
# Deploy hybrid SPA + API proxy to jscad.rkroll.com. The API is server/ in
# this dir (relocated from the retired jscad-studio app); the proxy below
# targets it.

# Required: Deployment modules to execute
export DEPLOY_TYPES="letsencrypt apache"

# Required: Basic configuration
export APP_NAME="jscad-web"
export DOMAIN_NAME="${DOMAIN_NAME:-jscad.rkroll.com}"
export REMOTE_HOST="${REMOTE_HOST:-jscad.rkroll.com}"
export REMOTE_USER="john"

# LetsEncrypt module configuration
export LETSENCRYPT_EMAIL="john@rkroll.com"

# Apache module configuration (hybrid: static app + /api proxy to server/ below)
export APACHE_MODE="hybrid"
export APACHE_CONTENT_DIR="."
# Workspace-aware build: the app bundle resolves @jscadui/* from the monorepo.
export APACHE_BUILD_CMD="node ../../scripts/fetch-sources.js && npm --prefix ../.. install --no-audit --no-fund && npm run build"
export APACHE_BUILD_ENABLED="yes"
export APACHE_WEB_ROOT="/var/www/${APP_NAME}"
export APACHE_PROXY_RULES="/api:${APP_PORT:?APP_PORT must be set}:/api"
export APACHE_SPA_MODE="yes"
export APACHE_CACHE_STATIC="yes"
export APACHE_SECURITY_HEADERS="yes"
