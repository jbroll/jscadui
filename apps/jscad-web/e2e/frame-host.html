<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>test host</title>
  </head>
  <body>
    <iframe id="frame" src="http://localhost:5121/" sandbox="allow-scripts" hidden></iframe>
    <iframe id="attacker" src="http://localhost:5123/frame-wrong.html" hidden></iframe>
    <script>
      const frame = document.getElementById('frame')
      const ready = new Promise(resolve => frame.addEventListener('load', resolve, { once: true }))
      window.frameReady = ready
      window.messages = []
      let seq = 0
      window.addEventListener('message', (e) => {
        if (e.source !== frame.contentWindow) return
        window.messages.push(e.data)
      })
      // The worker protocol as the app speaks it: { method, params, id } out,
      // a matching { method: '__RESPONSE__', params | error, id } back.
      window.send = (method, params) => ready.then(() => new Promise(resolve => {
        const id = ++seq
        const onMsg = (e) => {
          const d = e.data
          if (e.source !== frame.contentWindow || !d || d.method !== '__RESPONSE__' || d.id !== id) return
          window.removeEventListener('message', onMsg)
          resolve(d.error ? { ok: false, error: d.error } : { ok: true, result: d.params })
        }
        window.addEventListener('message', onMsg)
        frame.contentWindow.postMessage({ method, params: [params], id }, '*')
      }))
      window.seen = (method) => window.messages.find(m => m && m.method === method)
    </script>
  </body>
</html>
