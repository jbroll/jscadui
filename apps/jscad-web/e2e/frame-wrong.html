<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>wrong origin sender</title>
  </head>
  <body>
    <script>
      window.received = []
      window.addEventListener('message', e => window.received.push(e.data))
      // frame-ancestors forbids this origin from embedding the frame, so it is
      // reached through the host's frame collection, as a third-party widget would.
      window.send = (method, params) => {
        parent.frames[0].postMessage({ method, params: [params], id: 99 }, '*')
      }
    </script>
  </body>
</html>
