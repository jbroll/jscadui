#!/bin/bash
# Deploy configuration for the jscad-web API (Express + BetterAuth). The
# jscad-studio names below are the deployed unit and data directory; renaming
# them orphans both.
# Secrets (BETTER_AUTH_SECRET, OAuth ids/secrets, ROWBOAT_URL,
# ROWBOAT_DATABASE_ID) travel in the secrets file the
# express_app module deploys — never in this conf and never in git.

export DEPLOY_TYPES="express_app"

export APP_NAME="jscad-studio-api"
export DOMAIN_NAME="${DOMAIN_NAME:-jscad.rkroll.com}"

export REMOTE_HOST="${REMOTE_HOST:-jscad.rkroll.com}"
export REMOTE_USER="john"

# === EXPRESS APP MODULE ===

export EXPRESS_APP_PORT="${APP_PORT:?APP_PORT must be set — deploy via deploy-full.sh}"
export EXPRESS_APP_USER="jscad-studio"
export EXPRESS_APP_GROUP="jscad-studio"
export EXPRESS_APP_BASE_PATH="/var/lib"
export EXPRESS_APP_DATA_PATH="/var/lib/jscad-studio-api-data"
export EXPRESS_APP_CONFIG_PATH="/var/lib"
export EXPRESS_APP_MAIN_SCRIPT="dist/index.js"
export EXPRESS_APP_SECRETS_FILE="secrets.env"

export EXPRESS_APP_NODE_ENV="production"
export EXPRESS_APP_NODE_OPTIONS="--enable-source-maps --max-old-space-size=512"
