#!/bin/bash
# Deploy configuration for jscad-studio frontend (jscad-studio.rkroll.com)
# React-free ES-module app + Apache hybrid mode (static + /api proxy to the API).
# DOMAIN_NAME/REMOTE_HOST honor the environment so deploy-full.sh can target
# test without a second file; production values are the defaults.

# === REQUIRED VARIABLES ===

export DEPLOY_TYPES="letsencrypt apache"

export APP_NAME="jscad-studio"
export DOMAIN_NAME="${DOMAIN_NAME:-jscad.rkroll.com}"

export REMOTE_HOST="${REMOTE_HOST:-jscad.rkroll.com}"
export REMOTE_USER="john"

# Build-time origins: the app embeds the run origin (iframe src + bundle
# origin checks). Production default is the jscad-run host.
export STUDIO_RUN_ORIGIN="${STUDIO_RUN_ORIGIN:-https://jscad-run.rkroll.com}"

# === APACHE MODULE (Hybrid: static app + API proxy) ===

export APACHE_MODE="hybrid"
export APACHE_SERVER_ALIASES=""

# The build stage runs here (PROJECT_DIR); static_content ships build/ only.
export APACHE_CONTENT_DIR="."
# Workspace-aware build: the app bundle resolves @jscadui/* from the monorepo.
export APACHE_BUILD_CMD="npm --prefix ../.. install --no-audit --no-fund && npm run build"
export APACHE_BUILD_ENABLED="yes"
export APACHE_WEB_ROOT="/var/www/jscad-studio"

export APACHE_PROXY_RULES="/api:${APP_PORT:?APP_PORT must be set — deploy via deploy-full.sh}:/api"

export APACHE_SPA_MODE="yes"
export APACHE_CACHE_STATIC="yes"
export APACHE_SECURITY_HEADERS="yes"

# === LETSENCRYPT MODULE ===

export LETSENCRYPT_EMAIL="support@jscad-studio.rkroll.com"
