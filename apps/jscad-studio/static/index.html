<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="./favicon.png">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="main.css">
    <style>
      #chat {
        width: 360px;
        max-width: calc(100vw - 80px);
        display: flex;
        flex-direction: column;
        border-left: 1px solid #ccc;
        background-color: #f8f8f8;
      }
      .dark #chat {
        background-color: #333;
        border-left-color: #555;
      }
      #chat-header {
        padding: 8px 10px;
        font-weight: bold;
        border-bottom: 1px solid #ccc;
      }
      .dark #chat-header {
        border-bottom-color: #555;
      }
      #chat-messages {
        flex: 1;
        overflow-y: auto;
        padding: 10px;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .chat-msg {
        padding: 6px 8px;
        border-radius: 6px;
        white-space: pre-wrap;
        word-break: break-word;
      }
      .chat-msg.user {
        align-self: flex-end;
        background-color: #ddeeff;
      }
      .chat-msg.assistant {
        align-self: flex-start;
        background-color: #e8e8e8;
      }
      .chat-msg.error {
        align-self: stretch;
        background-color: #fdd;
        color: #a33;
      }
      .dark .chat-msg.user { background-color: #234; color: #cde; }
      .dark .chat-msg.assistant { background-color: #444; color: #ddd; }
      .dark .chat-msg.error { background-color: #633; color: #fbb; }
      .chat-tool {
        align-self: stretch;
        border: 1px solid #bbb;
        border-radius: 4px;
        background-color: #fff;
        font-family: monospace;
        font-size: 10pt;
      }
      .dark .chat-tool {
        background-color: #222;
        border-color: #666;
        color: #bbb;
      }
      .chat-tool-name {
        cursor: pointer;
        padding: 4px 8px;
      }
      .chat-tool-input,
      .chat-tool-result {
        margin: 0;
        padding: 4px 8px;
        border-top: 1px solid #ddd;
        white-space: pre-wrap;
        word-break: break-word;
      }
      .dark .chat-tool-input,
      .dark .chat-tool-result {
        border-top-color: #555;
      }
      #chat-form {
        display: flex;
        gap: 6px;
        padding: 8px;
        border-top: 1px solid #ccc;
      }
      .dark #chat-form {
        border-top-color: #555;
      }
      #chat-input {
        flex: 1;
      }
    </style>
    <title>JSCAD Studio</title>
  </head>
  <body>
    <div class="container">
      <div class="layout" id="layout">
        <div id="root">
          <div id="viewer"></div>
        </div>

        <div id="overlay">
          <div class="above-error">
            <div id="pipeline-stats">
              <div id="stats-content"></div>
              <progress id="progress" title="Processing..."></progress>
            </div>

            <div id="model-options">
              <div id="paramsHeader"></div>
              <div id="paramsDiv"></div>
            </div>
          </div>

          <div id="error-bar">
            <label id="error-name">Error:</label>
            <span id="error-message"></span>
          </div>
        </div>
      </div>

      <div id="editor">
        <div id="editor-drawer">
          <nav id="editor-nav">
            <button id="editor-file"></button>
            <ul id="editor-files"></ul>
          </nav>
          <div id="editor-container"></div>
          <a id="editor-hint">Shift-enter to update</a>
          <a id="editor-hint2">CTRL+S to save and update</a>
        </div>
        <div id="editor-toggle"></div>
      </div>

      <div id="chat"></div>

      <div id="menu">
        <button id="menu-button">JSCAD Studio</button>
        <div id="menu-content">
          <h2>Options</h2>
          <ul>
            <li><label for="dark-mode">Dark Mode</label><input type="checkbox" id="dark-mode"></li>
            <li><label for="show-axis">Show Axis</label><input type="checkbox" id="show-axis" checked></li>
            <li><label for="show-grid">Show Grid</label><input type="checkbox" id="show-grid" checked></li>
            <li><label for="smooth-render">Smooth Render</label><input type="checkbox" id="smooth-render" checked></li>
            <li><label for="zoom-to-fit">Zoom To Fit</label><input type="checkbox" id="zoom-to-fit" checked></li>
            <li>
              <label for="render-engine">Render Engine</label>
              <select id="render-engine">
                <option value="threejs">Three.js</option>
                <option value="regl">Regl</option>
              </select>
            </li>
          </ul>
        </div>
      </div>
    </div>

    <!-- Model code only ever runs in this sandboxed frame on the run origin;
         the app receives plain data back by postMessage. -->
    <iframe id="frame" src="__RUN_ORIGIN__/" sandbox="allow-scripts" hidden></iframe>

    <script>
      // The frame's message listener must exist before the first command; this
      // load-event promise bridges parse time and main.js evaluation.
      window.__frameReady = new Promise(resolve =>
        document.getElementById('frame').addEventListener('load', resolve, { once: true }))
    </script>
    <script type="module" src="./main.js"></script>
  </body>
</html>
