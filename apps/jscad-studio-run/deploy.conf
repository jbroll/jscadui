#!/bin/bash
# Deploy configuration for the studio compute frame (run.jscad-studio.rkroll.com).
# Static only: the hidden sandboxed iframe page plus its worker bundles. No
# proxy, no SPA fallback — unknown paths must 404, never serve index.html
# (an SPA fallback would break the blob worker's bundle XHRs).
# DOMAIN_NAME/REMOTE_HOST honor the environment for test deploys; production
# values are the defaults.

export DEPLOY_TYPES="letsencrypt apache"

export APP_NAME="jscad-studio-run"
export DOMAIN_NAME="${DOMAIN_NAME:-jscad-run.rkroll.com}"

export REMOTE_HOST="${REMOTE_HOST:-jscad-run.rkroll.com}"
export REMOTE_USER="john"

# Build-time origins: the frame bakes the allowed app origin (postMessage
# guard) and its own origin (CSP). Production default is the jscad pair.
export STUDIO_APP_ORIGIN="${STUDIO_APP_ORIGIN:-https://jscad.rkroll.com}"
export STUDIO_RUN_ORIGIN="${STUDIO_RUN_ORIGIN:-https://jscad-run.rkroll.com}"

# === APACHE MODULE (static only) ===

export APACHE_MODE="static"
export APACHE_SERVER_ALIASES=""

export APACHE_CONTENT_DIR="."
export APACHE_BUILD_CMD="npm --prefix ../.. install --no-audit --no-fund && npm run build"
export APACHE_BUILD_ENABLED="yes"
export APACHE_WEB_ROOT="/var/www/jscad-studio-run"

export APACHE_SPA_MODE="no"
export APACHE_CACHE_STATIC="yes"

# The stock security headers MUST stay off here: they emit
# X-Frame-Options: SAMEORIGIN (which would forbid the app origin from
# embedding this frame) and no CSP at all. The frame's real headers —
# CSP with frame-ancestors plus Permissions-Policy — are installed by
# deploy/hooks/apache.configure.post.sh, scoped to this vhost only.
export APACHE_SECURITY_HEADERS="no"

# === LETSENCRYPT MODULE ===

export LETSENCRYPT_EMAIL="support@jscad-studio.rkroll.com"
