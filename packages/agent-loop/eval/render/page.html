<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>eval render</title>
    <style>
      html,
      body {
        margin: 0;
        background: #ececec;
      }
      canvas {
        display: block;
      }
    </style>
  </head>
  <body>
    <canvas id="c" width="768" height="768"></canvas>
    <script>
      // eval/render.js adds three.js, then passes triangles and colours, never model code.
      // An uncoloured part gets one of these by its index among the uncoloured parts, cycling.
      const PALETTE = ['#c8553d', '#3d7cc8', '#5aa05a', '#d4a017', '#8e5bbf', '#3fb0b0', '#d07a3a', '#8a8a8a']
      let renderer = null
      let scene = null
      let box = null
      let key = null

      const decode = (data) => {
        const binary = atob(data)
        const bytes = new Uint8Array(binary.length)
        for (let i = 0; i < binary.length; i += 1) bytes[i] = binary.charCodeAt(i)
        return new Float32Array(bytes.buffer)
      }

      const dispose = (old) => {
        old?.traverse((node) => {
          node.geometry?.dispose()
          node.material?.dispose()
        })
      }

      window.drawModel = (parts) => {
        const T = window.THREE
        renderer ??= new T.WebGLRenderer({ canvas: document.getElementById('c'), antialias: true, preserveDrawingBuffer: true })
        renderer.setSize(768, 768, false)
        renderer.setClearColor(0xececec, 1)
        renderer.outputEncoding = T.sRGBEncoding
        dispose(scene)
        scene = new T.Scene()
        box = new T.Box3()
        let uncoloured = 0
        for (const { color, data } of parts) {
          const geometry = new T.BufferGeometry()
          geometry.setAttribute('position', new T.Float32BufferAttribute(decode(data), 3))
          geometry.computeVertexNormals()
          const tint = color ? new T.Color().setRGB(color[0], color[1], color[2]) : new T.Color(PALETTE[uncoloured++ % PALETTE.length])
          tint.convertSRGBToLinear()
          const surface = new T.MeshStandardMaterial({
            color: tint,
            roughness: 0.75,
            metalness: 0,
            flatShading: true,
            polygonOffset: true,
            polygonOffsetFactor: 1,
            polygonOffsetUnits: 1,
          })
          scene.add(new T.Mesh(geometry, surface))
          scene.add(new T.LineSegments(new T.EdgesGeometry(geometry, 30), new T.LineBasicMaterial({ color: 0x222222, transparent: true, opacity: 0.35 })))
          geometry.computeBoundingBox()
          box.union(geometry.boundingBox)
        }
        scene.add(new T.HemisphereLight(0xffffff, 0x9a9a9a, 1.6))
        key = new T.DirectionalLight(0xffffff, 1.4)
        scene.add(key)
        scene.add(key.target)
      }

      // Grading views: orthographic, framed to the bounding box's corners in view space with a 3% margin
      // on each side, centred on the box's projection. A non-square frame widens its longer axis.
      window.renderView = (dir, up) => {
        const T = window.THREE
        const [w, h] = [768, 768]
        const size = renderer.getSize(new T.Vector2())
        if (size.x !== w || size.y !== h) renderer.setSize(w, h, false)
        renderer.outputEncoding = T.sRGBEncoding
        const aspect = w / h
        const center = box.getCenter(new T.Vector3())
        const d = new T.Vector3(...dir).normalize()
        const radius = box.getSize(new T.Vector3()).length()
        const camera = new T.OrthographicCamera(-1, 1, 1, -1, 0.1, radius * 10)
        camera.up.set(...up)
        camera.position.copy(center).addScaledVector(d, radius * 3)
        camera.lookAt(center)
        camera.updateMatrixWorld()
        const inverse = camera.matrixWorldInverse
        let [x0, x1, y0, y1] = [Infinity, -Infinity, Infinity, -Infinity]
        for (const x of [box.min.x, box.max.x]) {
          for (const y of [box.min.y, box.max.y]) {
            for (const z of [box.min.z, box.max.z]) {
              const p = new T.Vector3(x, y, z).applyMatrix4(inverse)
              x0 = Math.min(x0, p.x)
              x1 = Math.max(x1, p.x)
              y0 = Math.min(y0, p.y)
              y1 = Math.max(y1, p.y)
            }
          }
        }
        const [cx, cy] = [(x0 + x1) / 2, (y0 + y1) / 2]
        const halfY = (Math.max(y1 - y0, (x1 - x0) / aspect) / 2) * 1.06
        const halfX = halfY * aspect
        Object.assign(camera, { left: cx - halfX, right: cx + halfX, top: cy + halfY, bottom: cy - halfY })
        camera.updateProjectionMatrix()
        const right = new T.Vector3().crossVectors(d, camera.up).normalize()
        key.position.copy(center).addScaledVector(d, radius).addScaledVector(right, radius * 0.6).addScaledVector(camera.up, radius)
        key.target.position.copy(center)
        renderer.render(scene, camera)
      }

      // `view` shots, drawn as the app's renderer (apps/jscad-web/src/aiViewRender.js) draws them:
      // CommonToThree's Phong material with face normals and no edge lines, its default blue for an
      // uncoloured part, an ambient light and a key light riding on the camera, linear output.
      let shotScene = null
      let shotCamera = null

      window.drawShotModel = (parts, bg) => {
        const T = window.THREE
        renderer ??= new T.WebGLRenderer({ canvas: document.getElementById('c'), antialias: true, preserveDrawingBuffer: true })
        dispose(shotScene)
        shotScene = new T.Scene()
        shotScene.background = new T.Color(bg[0], bg[1], bg[2])
        shotScene.add(new T.AmbientLight(0xeeeeee, 0.5))
        const light = new T.DirectionalLight(0xeeeef4, 0.7)
        light.position.set(50, 0, 100)
        shotCamera = new T.PerspectiveCamera(45, 1, 1, 50000)
        shotCamera.add(light)
        shotScene.add(shotCamera)
        for (const { color, data } of parts) {
          const geometry = new T.BufferGeometry()
          geometry.setAttribute('position', new T.BufferAttribute(decode(data), 3))
          geometry.computeVertexNormals()
          const tint = color ? new T.Color(color[0], color[1], color[2]) : 0x0084d1
          shotScene.add(new T.Mesh(geometry, new T.MeshPhongMaterial({ color: tint, flatShading: false })))
        }
      }

      // The camera comes framed from node (src/viewFrame.js): position, target, up, fov, aspect, near, far.
      window.renderShot = (camera, w, h) => {
        const T = window.THREE
        renderer.setSize(w, h, false)
        renderer.outputEncoding = T.LinearEncoding
        Object.assign(shotCamera, { fov: camera.fov, aspect: camera.aspect, near: camera.near, far: camera.far })
        shotCamera.up.set(...camera.up)
        shotCamera.position.set(...camera.position)
        shotCamera.lookAt(...camera.target)
        shotCamera.updateProjectionMatrix()
        renderer.render(shotScene, shotCamera)
      }
    </script>
  </body>
</html>
