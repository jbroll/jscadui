# ci/eval settings, sourced by ci/eval. Edit the working tree, then
#   sci push jscadui/eval
# sci push takes no arguments of its own; runs the local tree, uncommitted
# changes included, so this file is the only way to configure a run.

# Models run concurrently; each runs its API styles one after the other.
EVAL_MODELS="meta:muse-spark-1.3-contributor opencode-go:deepseek-v4.1-flash"

# API styles the chat can teach (packages/agent-loop/src/api.js). Every model
# runs every style, one result file per model and style.
EVAL_APIS="fluent modeling"

# Comma-separated fixture and/or group names; empty runs the default (ungrouped) suite.
EVAL_FIXTURES=""

# Runs per fixture.
EVAL_RUNS=3

# Conversations run at once, per model (each with its own crt executor), so at
# most models x EVAL_CONCURRENCY at once. With the default suite (12 fixtures
# under fluent, 11 under modeling, since fluent-chain is fluent-only), 3 runs
# and 2 models, a job is (12 + 11) x 3 x 2 = 138 conversations.
EVAL_CONCURRENCY=6
