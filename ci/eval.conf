# ci/eval settings, sourced by ci/eval. Edit the working tree, then
#   sci push jscadui/eval
# sci push takes no arguments of its own; runs the local tree, uncommitted
# changes included, so this file is the only way to configure a run.

# Every model x API pair runs concurrently, one lane each.
EVAL_MODELS="meta:muse-spark-1.3-contributor opencode-go:deepseek-v4.1-flash"

# API styles the chat can teach (packages/agent-loop/src/api.js). Every model
# runs every style, one result file per model and style.
EVAL_APIS="fluent modeling"

# Comma-separated fixture and/or group names; empty runs the default suite
# (the ungrouped fixtures and the harder group).
EVAL_FIXTURES=""

# Runs per fixture.
EVAL_RUNS=3

# Conversations run at once, per model x API lane (each with its own crt
# executor), so at most (models x APIs) x EVAL_CONCURRENCY at once. With the
# shipped 2 models and 2 APIs that is 4 lanes x 4 = 16 sandboxed conversations
# at once (host: 43G available, each sandbox capped at 2G). With the default
# suite (25 fixtures under fluent, 24 under modeling, since fluent-chain is
# fluent-only), 3 runs and 2 models, a job is (25 + 24) x 3 x 2 = 294
# conversations.
EVAL_CONCURRENCY=4
