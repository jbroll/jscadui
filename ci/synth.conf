# ci/synth settings, sourced by ci/synth. Edit the working tree, then
#   sci push jscadui/synth
# sci push runs the local tree, uncommitted changes included.

# Builder models, one concurrent lane each; empty runs every builder in the role table.
SYNTH_BUILDERS=""

# Comma-separated scenario names; empty runs every scenario.
SYNTH_SCENARIOS=""

# Sessions per scenario per builder.
SYNTH_RUNS=2

# Seconds after which a lane starts no new session; the CI job timeout is 7200.
SYNTH_DEADLINE_S=6600
