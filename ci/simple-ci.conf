# simple-ci project config for jscadui
# Sourced by sci when run from this directory.

# Ordered list of CI hosts to try — first reachable one wins.
CI_HOSTS=(
    "gpu:http://gpu:8080"
    "home.rkroll.com:tunnel:8080"
)

# Defaults (used when no CI_HOSTS entry is reachable)
CI_HOST=gpu
CI_REMOTE_SCRIPT=~/src/simple-ci/ci-rsync.sh
CI_SERVER_URL=http://gpu:8080

# bosl, bosl2, and snippet examples are gitignored (generated from corpus)
# but are required for the openscad comparison test suite.
# These --include rules must come before --filter=':- .gitignore' to override.
#
# The hand-maintained control files (skip.txt etc.) must also transfer for
# every suite. Suites ignored with a blanket `SUITE/*` rule (openscad-tests,
# openscad-examples, round-anything, ...) lose their control files otherwise:
# rsync honors the first matching rule, so the blanket exclude beats the
# `!*/skip.txt` gitignore negations and the harness grades hundreds of
# models that should be skipped or excluded.
CI_RSYNC_ARGS="
  --include=/apps/
  --include=/apps/jscad-web/
  --include=/apps/jscad-web/examples/
  --include=/apps/jscad-web/examples/openscad/
  --include=/apps/jscad-web/examples/openscad/bosl/
  --include=/apps/jscad-web/examples/openscad/bosl/**
  --include=/apps/jscad-web/examples/openscad/bosl2/
  --include=/apps/jscad-web/examples/openscad/bosl2/**
  --include=/apps/jscad-web/examples/openscad/snippet/
  --include=/apps/jscad-web/examples/openscad/snippet/**
  --include=/apps/jscad-web/examples/openscad/dotscad/
  --include=/apps/jscad-web/examples/openscad/dotscad/**
  --include=/apps/jscad-web/examples/openscad/**/skip.txt
  --include=/apps/jscad-web/examples/openscad/**/compare-skip.txt
  --include=/apps/jscad-web/examples/openscad/**/echo-skip.txt
  --include=/apps/jscad-web/examples/openscad/**/exclude.txt
  --include=/apps/jscad-web/examples/openscad/**/config.json
  --include=/apps/jscad-web/examples/openscad/**/ALL*.js
  --include=/apps/jscad-web/examples/openscad/**/categories.json
"
